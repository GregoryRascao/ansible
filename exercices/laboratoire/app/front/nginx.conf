server {
    listen 80;

    proxy_no_cache 1;
    proxy_cache_bypass 1;

    include /etc/nginx/mime.types;

    # Enable gzip compression for smaller transfer sizes
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml+rss application/xml application/vnd.ms-fontobject font/ttf font/opentype image/svg+xml application/wasm;
    gzip_proxied any;

    add_header Last-Modified $date_gmt;
    add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    if_modified_since off;
    expires off;
    etag off;

    location ~ ^/assets {
        root /usr/share/nginx/html;
        try_files $uri 404.html;
    }
    location ~ ^/media {
        root /usr/share/nginx/html;
        try_files $uri 404.html;
    }
    location ~ ^/ {
        root /usr/share/nginx/html;
        try_files $uri /index.html?$args;
    }
}
