  <h1>{{ 'manual.tableOfContents' |translate }}</h1>
  @for (group of tableOfContents(); track group.key) {
    <section>
      <h3>{{ group.key }}</h3>
      <ul>
        @for (item of group.values; track item.plugin) {
          <li (click)="openDialog(item)">{{ item.plugin }}</li>
        }
      </ul>
    </section>
  }
</p-scroll-panel>
<p-dialog [appendTo]="document"></p-dialog>
