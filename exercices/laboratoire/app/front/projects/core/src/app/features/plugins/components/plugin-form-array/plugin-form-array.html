@let def = arrayDef();
@let formArray = array();

<div class="flex flex-col gap-2">
  @for (formGroup of formArray.controls || []; track formGroup; let index = $index) {
    @if (def.group) {
      <div class="flex flex-col gap-2">
        <plugin-form-group [inline]="def.group.inLine" [group]="getGroup(index)" [groupDef]="def"/>
        <p-button severity="warn" (onClick)="removeItem(index)" [label]="'plugin.form.removeItem' |translate"/>
      </div>
      @if (!$last) {
        <hr class="text-primary">
      }
    }
  }
  <p-button (onClick)="addItem(def)" [label]="'plugin.form.addItem' |translate"/>
</div>
