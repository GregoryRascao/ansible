[defaults]
inventory = ./inventory/azure_rm.yml
host_key_checking = False
retry_files_enabled = False
gathering = smart
timeout = 30
forks = 10
[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
[ssh_connection]
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r